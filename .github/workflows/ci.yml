name: ci
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  CARGO_HTTP_USER_AGENT: dependency-ci
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with: &id001
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Resolve one fresh dependency snapshot
      run: 'cargo update

        rustc --version > resolver.txt

        cargo --version >> resolver.txt

        date -u +%FT%TZ >> resolver.txt

        sha256sum Cargo.lock >> resolver.txt'
    - uses: actions/upload-artifact@v7
      with:
        name: resolved-lock
        path: 'Cargo.lock

          resolver.txt'
        retention-days: 7
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: &id002
        name: resolved-lock
    - name: Toolchain (current stable)
      run: 'rustup update stable --no-self-update

        rustup default stable

        rustup component add rustfmt clippy

        rustup target add wasm32-unknown-unknown

        '
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
    - name: Resolve and record dependencies
      run: 'rustc --version

        cargo metadata --locked --format-version 1 > dependency-metadata.json

        '
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy (native, all targets)
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Test
      run: cargo test --locked
    - name: Clippy (wasm32, browser build)
      run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
    - name: Install matching Wasm test runner
      run: 'version=$(jq -r ''.packages[] | select(.name == "wasm-bindgen") | .version'' dependency-metadata.json)

        archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"

        base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}"

        mkdir -p "$RUNNER_TEMP/ckmg-wasm-runner"

        cd "$RUNNER_TEMP/ckmg-wasm-runner"

        curl -A ''ci-library-check'' --fail --location --retry 3 --remote-name "$base/$archive"

        curl -A ''ci-library-check'' --fail --location --retry 3 --remote-name "$base/$archive.sha256sum"

        checksum=$(cut -d '' '' -f1 "$archive.sha256sum")

        printf ''%s  %s\n'' "$checksum" "$archive" | sha256sum --check

        tar -xzf "$archive" --strip-components=1

        echo "$PWD" >> "$GITHUB_PATH"

        '
    - name: Execute shared vectors in headless Chrome
      env:
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        WASM_BINDGEN_USE_BROWSER: '1'
        WASM_BINDGEN_TEST_TIMEOUT: '60'
      run: 'export CHROMEDRIVER="$(command -v chromedriver)"

        cargo test --locked --target wasm32-unknown-unknown

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: dependency-lock
        path: 'Cargo.lock

          dependency-metadata.json

          '
    - name: Preserve formatting feedback
      if: failure()
      run: 'cargo fmt --all

        git diff --binary > formatting.patch'
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: formatting-check
        path: formatting.patch
        retention-days: 7
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: *id002
    - run: python3 .github/check-first-party.py
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories
    - name: Preserve formatting feedback
      if: failure()
      run: 'cargo fmt --all

        git diff --binary > formatting.patch'
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: formatting-dependency-policy
        path: formatting.patch
        retention-days: 7
    needs:
    - resolve
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
    - check
    - dependency-policy
    - resolve
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: *id002
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - name: Measure real round trips and failure paths
      run: 'rustc --version

        cargo llvm-cov --version

        cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly
        --ignore-filename-regex ''(/tests/|/tests\.rs$)'' --json --output-path coverage.json'
    - name: Require every reachable line and branch
      run: python3 .github/check-coverage.py coverage.json
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage
        path: 'coverage.json

          Cargo.lock

          resolver.txt'
        retention-days: 7
'on':
  push:
    branches:
    - '**'
    paths-ignore:
    - '**.md'
    - LICENSE
    - LICENSES/**
  pull_request: null
  workflow_dispatch: null
