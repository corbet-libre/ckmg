name: ci
permissions:
  contents: read
concurrency:
  group: ci
  cancel-in-progress: false
  queue: max
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  CARGO_HTTP_USER_AGENT: dependency-ci
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with: &id001
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Check the committed dependency graph before refresh
      run: python3 .github/check-first-party.py
    - name: Resolve one fresh dependency snapshot
      run: 'cargo update

        rustc --version > resolver.txt

        cargo --version >> resolver.txt

        date -u +%FT%TZ >> resolver.txt

        sha256sum Cargo.lock >> resolver.txt'
    - uses: actions/upload-artifact@v7
      with:
        name: resolved-lock
        path: 'Cargo.lock

          resolver.txt'
        retention-days: 7
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: &id002
        name: resolved-lock
    - name: Toolchain (current stable)
      run: 'rustup update stable --no-self-update

        rustup default stable

        rustup component add rustfmt clippy

        rustup target add wasm32-unknown-unknown

        '
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        cache-on-failure: true
    - name: Resolve and record dependencies
      run: 'rustc --version

        cargo metadata --all-features --locked --format-version 1 > dependency-metadata.json

        '
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy (native, all targets)
      run: cargo clippy --locked --all-features --all-targets -- -D warnings
    - name: Test
      run: cargo test --all-features --locked
    - name: Clippy (wasm32, browser build)
      run: cargo clippy --locked --all-features --lib --target wasm32-unknown-unknown -- -D warnings
    - name: Install matching Wasm test runner
      run: 'version=$(jq -r ''.packages[] | select(.name == "wasm-bindgen") | .version'' dependency-metadata.json)

        archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"

        base="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}"

        mkdir -p "$RUNNER_TEMP/ckmg-wasm-runner"

        cd "$RUNNER_TEMP/ckmg-wasm-runner"

        curl -A ''ci-library-check'' --fail --location --retry 3 --remote-name "$base/$archive"

        curl -A ''ci-library-check'' --fail --location --retry 3 --remote-name "$base/$archive.sha256sum"

        checksum=$(cut -d '' '' -f1 "$archive.sha256sum")

        printf ''%s  %s\n'' "$checksum" "$archive" | sha256sum --check

        tar -xzf "$archive" --strip-components=1

        echo "$PWD" >> "$GITHUB_PATH"

        '
    - name: Execute shared vectors in headless Chrome
      env:
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        WASM_BINDGEN_USE_BROWSER: '1'
        WASM_BINDGEN_TEST_TIMEOUT: '60'
      run: 'export CHROMEDRIVER="$(command -v chromedriver)"

        cargo test --all-features --locked --target wasm32-unknown-unknown

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: dependency-lock
        path: 'Cargo.lock

          dependency-metadata.json

          '
    - name: Preserve formatting feedback
      if: failure()
      run: 'cargo fmt --all

        git diff --binary > formatting.patch'
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: formatting-check
        path: formatting.patch
        retention-days: 7
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: *id002
    - run: 'python3 .github/check-first-party.py

        python3 .github/test-source-coverage.py

        node --test .github/test-auto-merge.mjs'
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories
    - name: Preserve formatting feedback
      if: failure()
      run: 'cargo fmt --all

        git diff --binary > formatting.patch'
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: formatting-dependency-policy
        path: formatting.patch
        retention-days: 7
    needs:
    - resolve
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
    - check
    - dependency-policy
    - resolve
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: *id002
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
        cache-on-failure: true
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - name: Measure real round trips and failure paths
      run: 'rustc --version

        cargo llvm-cov --version

        cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly
        --ignore-filename-regex ''(/tests/|/tests\.rs$)'' --json --output-path coverage.json'
    - name: Export source counters from the same execution
      run: cargo llvm-cov report --locked --branch --ignore-filename-regex '(/tests/|/tests\.rs$)' --lcov
        --output-path coverage.lcov
    - name: Export independent source locations from the same execution
      run: cargo llvm-cov report --locked --branch --ignore-filename-regex '(/tests/|/tests\.rs$)' --text
        --output-path coverage.txt
    - name: Require every emitted source line and branch
      run: 'python3 .github/check-coverage.py coverage.json || true

        python3 .github/check-source-coverage.py coverage.lcov coverage.json coverage.txt'
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage
        path: 'coverage.lcov

          coverage.json

          Cargo.lock

          resolver.txt

          coverage.txt'
        retention-days: 7
  wasm-coverage:
    needs: [coverage, resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: python3 .github/browser-coverage-runner.py
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -Zno-profiler-runtime -Clink-args=--no-gc-sections --cfg=owned_browser_coverage
      WASM_BINDGEN_TEST_ONLY_WEB: "1"
      WASM_BINDGEN_SPLIT_LINKED_MODULES: "1"
      CHROMEDRIVER: /usr/bin/chromedriver
      CC_wasm32_unknown_unknown: clang
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: resolved-lock
      # Experimental upstream coverage runs on current nightly; product builds remain stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-coverage
      - id: binding-version
        run: |
          python3 - <<'PYCODE'
          import os, tomllib
          packages = tomllib.load(open('Cargo.lock', 'rb'))['package']
          version = next(p['version'] for p in packages if p['name'] == 'wasm-bindgen')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + version + '\n')
          PYCODE
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,wasm-bindgen-cli@${{ steps.binding-version.outputs.version }}
      - name: Report instrumentation versions
        run: |
          rustc --version --verbose
          cargo llvm-cov --version
          clang --version
      - name: Install maintained browser driver
        run: python3 -m pip install -r .github/requirements.txt
      - name: Measure actual browser Rust lines and branches
        run: cargo llvm-cov test --locked --all-features --branch --coverage-target-only --target wasm32-unknown-unknown --json --output-path wasm-coverage.json --ignore-filename-regex '/tests/'
      - name: Export browser source counters from the same execution
        run: cargo llvm-cov report --target wasm32-unknown-unknown --lcov --output-path wasm-coverage.lcov --ignore-filename-regex '/tests/'
      - name: Export annotated browser source locations from the same execution
        run: cargo llvm-cov report --target wasm32-unknown-unknown --text --output-path wasm-coverage.txt --ignore-filename-regex '/tests/'
      - name: Enforce actual browser Rust coverage
        run: python3 .github/check-source-coverage.py wasm-coverage.lcov wasm-coverage.json wasm-coverage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-coverage
          path: |
            wasm-coverage.lcov
            wasm-coverage.json
            wasm-coverage.txt

'on':
  workflow_dispatch:
