version: 2
updates:
- package-ecosystem: cargo
  directories:
  - /
  - /.github/coverage-runtime
  schedule:
    interval: daily
  open-pull-requests-limit: 0
  groups:
    cargo:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
  groups:
    actions:
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /.github
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
