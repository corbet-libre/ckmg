schema = 1
project = "ckmg"
repository = "https://git.corbet.ch/corbet-foss/ckmg.git"

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["jq", "--version"], ["curl", "--version"], ["python3", "--version"], ["chromedriver", "--version"], ["chromium", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "dependency-metadata.json"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

# Original native owner tests, independently of the unchanged full cached gate.
[checks.native]
kind = "commands"
commands = [["bash", ".ci/native.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"]]
cache_outputs = ["dependency-metadata.json"]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock"]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
scheduler = "crow"
checks = ["verify", "advisories"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[jobs.native]
scheduler = "crow"
checks = ["native"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "ckmg"

# Retain the reviewed integration graph before a separate locked verification.
[jobs.resolve-dependencies]
scheduler = "crow"
checks = ["resolve-dependencies"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
