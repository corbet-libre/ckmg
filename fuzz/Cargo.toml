[package]
name = "ckmg-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "1"
ckmg = { path = ".." }

[[bin]]
name = "peer_wire"
