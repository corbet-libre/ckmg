[package]
name = "ckmg"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Key management for the member vault: root, device and purpose keys in Veilid's VLD0 format, opaque PRF derivation and custody"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/ckmg"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "src/**",
    "tests/**",
    "docs/**",
    "README.md",
    "LICENSE",
    "LICENSE.md",
    "LICENSES/*.txt",
]

[lib]
crate-type = ["rlib"]

[features]
default = []
passport = ["dep:cpsd"]
native-records = ["dep:cvln"]

[dependencies]
cpsd = { git = "https://github.com/corbet-foss/cpsd", branch = "main", default-features = false, optional = true }
# The crypto crates Veilid's VLD0 cryptosystem uses, at the versions Veilid uses.
ed25519-dalek = { version = "3.0.0", features = ["digest", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20 = { version = "0.10", features = ["xchacha", "zeroize"] }
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
rand_chacha = "0.10"
rand_core = "0.10"
blake3 = "1.8"
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = "1.8"
data-encoding = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cvln = { git = "https://github.com/corbet-foss/cvln", branch = "main", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[dev-dependencies]
cpsd = { git = "https://github.com/corbet-foss/cpsd", branch = "main", default-features = false }
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3.79"
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".github/coverage-runtime" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }
unsafe_code = "forbid"
missing_docs = "warn"
