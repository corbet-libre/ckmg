[package]
name = "ckmg"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Key management for the member vault: root, device and purpose keys in Veilid's VLD0 format, delegation, and passkey unlock"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/ckmg"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "src/**",
    "tests/**",
    "README.md",
    "LICENSE",
    "LICENSE.md",
    "LICENSES/*.txt",
]

[lib]
crate-type = ["rlib"]

[dependencies]
# The crypto crates Veilid's VLD0 cryptosystem uses, at the versions Veilid uses.
ed25519-dalek = { version = "3.0.0", features = ["digest", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
blake3 = "1.8"
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = "1.8"
data-encoding = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "CredentialsContainer",
    "CredentialCreationOptions",
    "CredentialRequestOptions",
] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
